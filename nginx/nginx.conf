# Nginx reverse proxy for the Schengen Platform
# Routes:
#   /api/*  → NestJS backend (port 3001)   — the /api prefix is stripped
#   /*      → Next.js frontend (port 3000)

upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Allow large request bodies (just in case)
    client_max_body_size 10M;

    # ── API requests → backend (strip the /api prefix) ──
    # e.g. /api/routes/IN/AT  →  backend receives /routes/IN/AT
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Everything else → frontend ──
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
